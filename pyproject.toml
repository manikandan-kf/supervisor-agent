# Project metadata, dependencies and tool configuration — PEP 621.
#
#     pip install -e libs/agent_governance -e ".[dev]"   # library, package, tooling
#     ruff check .                                         # lint + the security ruleset
#     pytest                                               # both test trees, offline
#
# Two things this file deliberately does NOT own:
#
#   * **What the serving container installs.** That is `requirements.txt`, which
#     `deploy/log_and_deploy.py` bakes into the model artifact together with the
#     shared governance wheel. The `dependencies` below mirror it for local
#     development and CI and must be kept in step with it.
#   * **The deployed version.** A deployment is identified by its Unity Catalog
#     registered-model version, assigned at deploy time. `version` below
#     identifies the *source*.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-agent"
description = "Governed LangGraph supervisor agent, served as an MLflow ResponsesAgent on Databricks Model Serving."
readme = "README.md"
# 3.11 is the floor DEPLOYMENT.md names and the version CI tests against. No
# upper bound: this project runs on 3.12 in development today.
requires-python = ">=3.11"
dynamic = ["version"]

# Mirrors requirements.txt exactly. The shared library is not listed here —
# it is installed from `libs/agent_governance` (see requirements-dev.txt), and
# baked into the model artifact as a wheel at deploy time.
dependencies = [
    "mlflow==3.15.1",
    "langgraph==1.2.11",
    "langchain-core==1.5.3",
    "langchain==1.2.10",
    "databricks-langchain[memory]==0.20.0",
    "databricks-sdk==0.94.0",
    "databricks-agents==1.11.0",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# Developer tooling. Never installed into the serving container.
dev = [
    "ruff==0.14.6",
    "pytest==9.1.1",
]

[tool.setuptools.dynamic]
version = { attr = "supervisor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Both trees: the supervisor's governance contract and the shared library's
# own tests. Each has a conftest that puts its source on the path, so a bare
# `pytest` works in a fresh clone without installing anything.
testpaths = ["tests", "libs/agent_governance/tests"]

# ── ruff: lint and the security ruleset ──────────────────────────────────────
#
#     ruff check .              # lint + the security ruleset
#     ruff check --select S .   # security findings only
#
# The `S` ruleset is a port of flake8-bandit, so this covers the SAST pass and
# general linting with one tool. `ruff check .` runs in CI.
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".databricks", "mlruns", "dist", "build"]

[tool.ruff.lint]
# `E`/`F` are the pyflakes+pycodestyle baseline; `S` is the security ruleset
# (flake8-bandit); `B` catches the bug-shaped patterns most worth having in a
# governance layer; `I` keeps import order deterministic.
select = ["E", "F", "S", "B", "I"]

ignore = [
    # Long lines. This codebase carries explanatory prose in docstrings and
    # comments deliberately.
    "E501",
]

[tool.ruff.lint.isort]
# The shared library is a separate distribution, so it sorts with the
# third-party group — the same position it holds once installed from a wheel.
known-first-party = ["supervisor"]

[tool.ruff.lint.per-file-ignores]
# ── S608: SQL built by interpolating a table name ────────────────────────────
# SQL cannot parameterize an *identifier*, so a table name has to reach the
# statement as text. Every value in these statements is bound with `%s`; only
# the identifier is interpolated, and `agent_governance.sql.safe_identifier`
# validates it at construction against
# `^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*){0,2}$`, so nothing carrying
# a quote, a semicolon, whitespace or a comment marker can reach these strings.
"libs/agent_governance/src/agent_governance/config_store.py" = ["S608"]
"libs/agent_governance/src/agent_governance/audit.py" = ["S608"]
"libs/agent_governance/src/agent_governance/review_queue.py" = ["S608"]

# ── S101 / S105 / S106: asserts and literal secrets, in tests only ───────────
# `assert` is how a test states its expectation. The two hardcoded-password
# rules fire on the obviously-synthetic values a test needs in order to prove
# redaction works at all. No `src/` or `libs/**/src/` file is exempt.
"tests/*" = ["S101", "S105", "S106"]
"libs/agent_governance/tests/*" = ["S101", "S105", "S106"]

# ── S110: quiet except ───────────────────────────────────────────────────────
# One best-effort path in a deploy script — probing whether a prompt alias
# already exists before registering — where the failure genuinely does not
# matter and there is nowhere useful to report it.
"deploy/register_prompts.py" = ["S110"]
