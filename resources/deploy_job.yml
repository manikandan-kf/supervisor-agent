# The deployment job: prompts, governed configuration, the shared library, then
# the model and its endpoint.
#
# Three tasks run in parallel; `deploy_agent` waits for the two whose output
# the endpoint reads at boot. Every path is built from ${var.catalog} and
# ${var.schema}, the same variables schema.yml uses, so the two cannot drift.

resources:
  jobs:
    supervisor_agent_deploy:
      name: supervisor-agent-deploy

      tasks:
        - task_key: register_prompts
          environment_key: default
          spark_python_task:
            python_file: deploy/register_prompts.py
            parameters:
              - "--catalog-schema"
              - "${var.catalog}.${var.schema}"
              - "--alias"
              - "${bundle.target}"

        # Seeds the governed configuration table from the bundled YAML, so a fresh
        # workspace is governed before the endpoint first serves. Idempotent: a
        # document identical to the active version is skipped. Afterwards a config
        # change is `deploy/publish_config.py --apply` alone — no bundle deploy.
        - task_key: publish_config
          environment_key: default
          spark_python_task:
            python_file: deploy/publish_config.py
            parameters:
              - "--apply"
              - "--lakebase-instance"
              - "${var.lakebase_instance}"
              - "--lakebase-schema"
              - "${var.lakebase_schema}"
              - "-m"
              - "seeded by supervisor-agent-deploy (${bundle.target})"

        # Publishes this deploy's governance wheel to the platform volume for the
        # worker agents. Idempotent per version; the supervisor does not read it.
        - task_key: publish_library
          environment_key: default
          spark_python_task:
            python_file: deploy/publish_library.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.platform_schema}"
              - "--volume"
              - "${var.library_volume}"

        - task_key: deploy_agent
          depends_on:
            - task_key: register_prompts
            - task_key: publish_config
          environment_key: default
          spark_python_task:
            python_file: deploy/deploy_agent.py
            parameters:
              - "--uc-model"
              - "${var.catalog}.${var.schema}.${var.model_name}"
              - "--experiment"
              - "${var.experiment}"
              # Traces persist as UC Delta tables in this target's own schema
              # (solution §08): governed by UC, queryable from SQL, no per-experiment
              # cap. schema.yml creates that schema, so the grants already hold.
              - "--trace-catalog-schema"
              - "${var.catalog}.${var.schema}"
              - "--routing-endpoint"
              - "${var.routing_llm_endpoint}"
              - "--environment"
              - "${bundle.target}"
              - "--prompt-catalog-schema"
              - "${var.catalog}.${var.schema}"
              - "--prompt-alias"
              - "${bundle.target}"
              - "--workers"
              - "${var.workers}"
              - "--lakebase-instance"
              - "${var.lakebase_instance}"
              - "--lakebase-schema"
              - "${var.lakebase_schema}"
              - "--multi-model"
              - "${var.multi_model_enabled}"
              - "--deploy-method"
              - "${var.deploy_method}"

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - -r requirements.txt
              - ./libs/agent_governance/dist/*.whl
