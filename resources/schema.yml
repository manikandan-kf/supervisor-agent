# Unity Catalog schema for one environment: the registered model, the prompts,
# the governed configuration and the MLflow trace tables all land here.
#
# It must exist before the job runs, and `bundle deploy` creates it — so the
# `register_prompts` and `log_and_deploy` tasks can address
# ${var.catalog}.${var.schema} without a pre-flight step.
#
# Deploying into a schema that already exists and is owned by someone else:
# delete this file (or drop it from `include`) and create the schema by hand.
# Left in place, the bundle claims ownership, and `bundle destroy` would then
# take the schema and everything in it — including any other project's models.

resources:
  schemas:
    supervisor_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Supervisor Agent — model, prompts, governed configuration.
