# Databricks Asset Bundle for the Supervisor Agent.
#
# This file holds only what is true for the whole bundle: its name, the
# variables every target reuses, how the shared library is built, what is
# synced, and the targets themselves. Each resource lives in its own file under
# resources/ and is picked up by the `include` glob below, so adding a resource
# is a new file rather than another hundred lines here:
#
#   resources/deploy_job.yml  the job that registers, publishes and deploys
#   resources/lakebase.yml    shared infrastructure — disabled, see the file
#
# The bundle deliberately owns ONLY the job. It does not own the Unity Catalog
# schema: an owned schema is dropped with everything in it by `bundle destroy`,
# including another project's models, and the common case is deploying into a
# schema that already exists. Create it once by hand (DEPLOYMENT.md §4). A
# workspace where this bundle really is the schema's sole owner adds
# resources/schema.yml back — the five lines are in DEPLOYMENT.md §4.
#
# What the bundle does NOT own: the serving endpoint. deploy_agent.py creates
# it imperatively — `databricks.agents.deploy()` by default, or the Model
# Serving SDK when `deploy_method: serving-api` — right after registering the
# model version it must serve. A declarative `model_serving_endpoints` resource
# would have to name a version that does not exist until the job runs. So the
# endpoint survives `bundle destroy`: remove it with
# `databricks serving-endpoints delete <name>` first.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run supervisor_agent_deploy -t dev
#
# Full prerequisites and step order: DEPLOYMENT.md

bundle:
  name: langgraph-supervisor

# Every *.yml under resources/ is merged into this configuration. A file may
# declare `resources:` and nothing else; one that is entirely commented out
# contributes nothing, which is how resources/lakebase.yml ships disabled.
include:
  - resources/*.yml

# ── One deployment per environment, sharing nothing ─────────────────────────
#
# Every target gets its own Unity Catalog schema and its own Lakebase Postgres
# schema, both named after the target:
#
#                       dev                        prod
#   UC schema           workspace.supervisor_dev   workspace.supervisor_prod
#   registered model    …supervisor_dev.supervisor_agent
#   serving endpoint    agents_workspace-supervisor_dev-supervisor_agent
#   prompt alias        @dev                       @prod
#   Lakebase schema     supervisor_dev             supervisor_prod
#   ENVIRONMENT         dev                        prod
#   routing model       sonnet                     opus
#   workers             simulated                  live
#
# The serving endpoint name is derived from the registered model's full name, so
# separating the schema separates the endpoint too.
#
# `dev` is a *deployed* environment and is held to the full runtime contract:
# durable Lakebase state or refuse to boot, no safety-critical setting disabled,
# every turn under a time budget. `ENVIRONMENT=local` is the only value that
# relaxes any of that, and nothing here ever sets it.

variables:
  catalog:
    description: Unity Catalog catalog holding the schemas below.
    default: workspace
  schema:
    description: >-
      Schema for the model, the prompts and the governed configuration. One per
      target, so a deploy to dev cannot touch prod's registered model or its
      endpoint. Override with --var schema= only to run a second isolated copy
      of one environment.
    default: supervisor_${bundle.target}
  model_name:
    description: Registered model name, unqualified.
    default: supervisor_agent
  experiment:
    description: >-
      MLflow experiment holding this environment's runs and traces. One per
      target, so dev traffic and prod traffic never share a trace query.
    default: /Shared/supervisor-agent-${bundle.target}
  routing_llm_endpoint:
    description: >-
      Model Serving endpoint of the routing LLM — used for guardrail verdicts
      and context resolution. Must exist in the workspace and be on the
      approved model list.
    default: databricks-claude-sonnet-4-5
  workers:
    description: >-
      'simulated' stands in for worker agents that are not deployed yet;
      'live' declares their endpoints as resources and calls them for real.
      Keep this 'simulated' until the worker endpoints actually exist —
      declaring a resource that does not exist fails the model registration.
    default: simulated
  multi_model_enabled:
    description: >-
      'true' lets each agent registry entry select its own serving endpoint for
      that agent's governance calls via an optional `model` field. Ships
      disabled; enabling is configuration only.
    default: "false"
  lakebase_instance:
    description: >-
      Lakebase database instance backing durable conversation memory, long-term
      memory, the governed config table and the Postgres audit
      sink. Create it first (DEPLOYMENT.md §5, or enable resources/lakebase.yml);
      declaring one that does not exist fails the model registration. One
      instance serves every environment — they are separated by lakebase_schema.
    default: supervisor-memory
  lakebase_project:
    description: >-
      Lakebase Autoscaling PROJECT, for a workspace that has a project rather
      than a provisioned instance. Set this OR lakebase_instance, not both —
      the runtime resolves the project first. A project cannot be declared as
      a model resource (the MLflow resource type names an instance), so a
      deployment on this form also needs endpoint_secret_scope below.
    default: ""
  lakebase_branch:
    description: >-
      Branch inside lakebase_project. Empty uses the project's default branch.
      Environments are still separated by lakebase_schema, not by branch.
    default: ""
  endpoint_secret_scope:
    description: >-
      Databricks secret scope holding DATABRICKS_HOST, DATABRICKS_CLIENT_ID and
      DATABRICKS_CLIENT_SECRET for the SERVING CONTAINER. Stamped onto the
      endpoint as {{secrets/<scope>/<key>}} references, never values. Needed
      only where no Lakebase resource can be declared — with a declared
      instance the endpoint gets its own short-lived credential and this stays
      empty. DEPLOYMENT.md §6a.
    default: ""
  lakebase_schema:
    description: >-
      Postgres schema inside the instance that this environment owns. Created
      on first use by whichever job task or replica connects first (the runtime
      issues CREATE SCHEMA IF NOT EXISTS on every pool it opens). Empty means
      `public`, the single-environment shape.
    default: supervisor_${bundle.target}
  deploy_method:
    description: >-
      How deploy_agent.py creates the endpoint. 'agents' calls
      databricks.agents.deploy(); 'serving-api' uses the Model Serving SDK
      directly — same endpoint name, same tracing setup, no Review App entry.
      Switch to 'serving-api' in a workspace where agents.deploy() fails
      (Agent Framework registration or the AI Gateway check at create time).
    default: agents
  deploy_wait_minutes:
    description: >-
      How long the deploy task blocks waiting for the endpoint to report READY,
      failing the job if it does not. 0 returns as soon as the rollout is
      initiated — which makes `bundle run` succeed while the endpoint may still
      be crash-looping, so a target that people deploy by hand sets a real
      budget here.
    default: "0"
  platform_schema:
    description: >-
      The platform-wide schema shared by EVERY agent — not an environment
      schema. Holds the volume the shared governance library is published to,
      so the worker agents install the same wheel the supervisor runs.
    default: agent_platform
  library_volume:
    description: Volume in the platform schema that holds published wheels.
    default: libs

# ── The shared governance library ───────────────────────────────────────────
#
# Built locally by `bundle deploy`, uploaded with the bundle, installed into the
# job environment (so the log-time validation prediction can import it) and,
# by deploy_agent.py, baked into the model artifact under wheels/ so the
# serving container installs the exact copy that was tested.
artifacts:
  agent_governance:
    type: whl
    path: libs/agent_governance
    build: python -m pip wheel --no-deps --wheel-dir dist .
    files:
      - source: dist/*.whl

# What the job needs, named explicitly so it is uploaded even where a
# .gitignore rule would exclude it. `include` ADDS to the sync set. The built
# wheel is gitignored and is included here on purpose: deploy_agent.py reads
# the file to bake it into the model artifact.
sync:
  include:
    - src/**
    - deploy/**
    - libs/**
    - libs/agent_governance/dist/*.whl
    - requirements.txt

targets:
  # A deployed environment on Databricks, with its own UC schema, its own
  # Lakebase schema, its own endpoint and its own prompts. Not a local mode:
  # ENVIRONMENT=dev is deployed, so the endpoint refuses to boot without durable
  # state exactly as prod does. The cheap model tier and the simulated workers
  # are the only things that make it "dev".
  dev:
    default: true
    # Deliberately NOT `mode: development`. Development mode prefixes resource
    # names with the developer's username, and for a UC schema that prefix is
    # not suppressible — it would create `workspace.dev_<user>_supervisor_dev`
    # and, because the endpoint name derives from the model's full name,
    # silently rename the endpoint. Two developers sharing one workspace pass
    # separate `--var schema=` and `--var lakebase_schema=` values instead.
    workspace:
      # Pins the target to one workspace, so a stray CLI profile cannot deploy
      # dev somewhere else.
      host: https://adb-7405616085045939.19.azuredatabricks.net
    variables:
      catalog: ips_uc_devops_enable
      # The UC schema already exists and is not owned by this bundle; see the
      # note above `include:` for why the bundle owns only the job.
      schema: ips_agent_modernization
      # The wheel volume lands in the same existing schema rather than a new
      # `agent_platform` the bundle would have to create. Move it to a
      # dedicated schema when a second agent starts consuming the wheel.
      platform_schema: ips_agent_modernization
      # Gemma is a completion model. Both governance calls use
      # with_structured_output(), so this endpoint MUST support tool calling or
      # every turn fails closed. Verify before deploying.
      routing_llm_endpoint: databricks-gemma-3-12b
      workers: simulated
      # agents.deploy() fails in this workspace; create the endpoint through the
      # Model Serving SDK instead — same endpoint name, same tracing.
      deploy_method: serving-api
      # This workspace has a Lakebase *project/branch*, not a provisioned
      # instance, and the MLflow resource type names an instance — so no
      # Lakebase resource is declared and the address travels as job-task
      # parameters instead.
      lakebase_instance: ""
      lakebase_project: ips-supervisor-agent-dev
      lakebase_branch: production
      # Consequence of the line above: with no declared resource the container
      # has no minted credential, so it authenticates as the service principal.
      # The scope must hold DATABRICKS_HOST, DATABRICKS_CLIENT_ID and
      # DATABRICKS_CLIENT_SECRET; only references reach the endpoint.
      endpoint_secret_scope: ips_agent_modernization
      # Block until the endpoint is READY, so `bundle run` failing means the
      # deployment failed. Container build plus first boot is 10–15 minutes.
      deploy_wait_minutes: "40"

  prod:
    mode: production
    workspace:
      # Set this before deploying to prod. Production mode refuses to run
      # against whatever profile happens to be active.
      host: https://<your-prod-workspace>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Strongest approved model for live governance decisions.
      routing_llm_endpoint: databricks-claude-opus-4-5
      # Prod expects the real worker endpoints to exist.
      workers: live
      # Schema separation (supervisor_prod) keeps dev and prod from sharing a
      # row. Set a dedicated instance here instead when prod needs its own
      # database — a separate failure domain and separate capacity:
      #   lakebase_instance: supervisor-memory-prod
