# Persona -> agent mapping, keyed by identity-provider GROUP name.
#
# FALLBACK ONLY. The calling application is the single source of truth: it
# derives the caller's permitted agents from the caller's roles and passes that
# set to the supervisor as `permitted_agents` in custom_inputs; the RBAC gate
# uses it, and this file is not consulted.
#
# It is still read when `permitted_agents` is absent — a caller that predates
# the field, or a direct endpoint invocation during development. That is the
# only path where a stale entry here could matter, so keep it in step with the
# identity-provider groups it mirrors.
#
# What enforces access at the data level is the RBAC gate revalidating the
# invocation path's agent-id against the permitted set on every call, not this
# file.
roles:
  BA:
    - requirement-agent
  QA:
    - test-case-agent
  Developer:
    - coding-agent
    - test-case-agent
  DevOps:
    - deployment-agent
  Engineering Manager:
    - requirement-agent
    - deployment-agent
