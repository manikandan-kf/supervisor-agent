# Continuous integration — and, as much as that, the evidence trail.
#
# Three controls exist in this repository and none of them produces evidence
# unless something automated runs them:
#
#   * `ruff check --select S` — the SAST pass.
#   * `pytest` — the governance contract (the supervisor's tests) and the
#     shared library's own tests, including the fault-injection and
#     negative-authorization cases.
#   * the dependency tree — for an agent, most of the attack surface is code
#     nobody here wrote (OWASP Top 10 for Agentic Applications 2026, ASI04).
#
# The artifact upload is the point of the last step in each job: a run of this
# workflow *is* the evidence-pack entry, retained and linkable.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual runs matter for the evidence pack: an assessor asking "when were the
  # controls last checked" needs a dated run without waiting for a commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repository.
permissions:
  contents: read

jobs:
  supervisor:
    name: Supervisor — lint, SAST, tests, library wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor `pyproject.toml` names and the Model Serving image agrees on.
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is what ships inside the MLflow model artifact;
          # requirements-dev.txt adds the shared library (editable) and tooling.
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and SAST (ruff)
        run: |
          ruff check . --output-format=github
          ruff check . --output-format=json > ruff-findings.json || true

      - name: Tests
        run: pytest -q --junitxml=pytest-results.xml

      - name: Build the shared library wheel
        # The same command `databricks bundle deploy` runs. A wheel that does
        # not build here does not deploy.
        run: python -m pip wheel --no-deps --wheel-dir libs/agent_governance/dist libs/agent_governance

      - name: Upload evidence
        # `always()` so a *failing* run still produces its artifact.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-evidence-${{ github.run_number }}
          path: |
            pytest-results.xml
            ruff-findings.json
            libs/agent_governance/dist/*.whl
          retention-days: 90
          if-no-files-found: warn

  supply-chain:
    name: Supply chain — dependencies, secrets, SBOM
    runs-on: ubuntu-latest
    # ASI04 asks for a component inventory, integrity and vulnerability checking
    # of what actually gets installed, and enforcement before deployment.
    # `requirements.txt` is pinned exactly, so what this job resolves and what
    # Model Serving installs are the same set. Turning `continue-on-error` off
    # makes this a release gate; it is left on until the client decides who
    # triages a new advisory and on what clock.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can walk commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit==2.9.0 cyclonedx-bom==7.1.4

      - name: Dependency vulnerabilities (pip-audit)
        # Reads the installed environment rather than the requirements file, so
        # the report covers the transitive closure that ships inside the model.
        continue-on-error: true
        run: |
          pip-audit --format=json --output=pip-audit.json || true
          pip-audit || true

      - name: Component inventory (CycloneDX SBOM)
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence-${{ github.run_number }}
          path: |
            pip-audit.json
            sbom.json
          retention-days: 90
          if-no-files-found: warn
